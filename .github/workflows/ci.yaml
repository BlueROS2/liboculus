name: ROS Industrial CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  industrial-ci:
    name: Run Industrial CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          # Humble is the primary BlueROS2 target (Ubuntu 22.04)
          - {ROS_DISTRO: humble}
          # Secondary: test against newer distros as well
          - {ROS_DISTRO: jazzy}
          - {ROS_DISTRO: rolling}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run ROS Industrial CI
        uses: ros-industrial/industrial_ci@master
        env: ${{matrix.env}}
